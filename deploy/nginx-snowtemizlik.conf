# Snow Temizlik - nginx ayarı (Keyubu VDS)
# Konum: /etc/nginx/sites-available/snowtemizlik.conf
# HTTPS satırlarını certbot --nginx kendisi ekler.

server {
    listen 80;
    listen [::]:80;
    server_name snowtemizlik.com www.snowtemizlik.com;

    root /var/www/snowtemizlik;
    index index.html;
    charset utf-8;

    # www -> apex (canonical https://snowtemizlik.com/)
    if ($host = www.snowtemizlik.com) {
        return 301 $scheme://snowtemizlik.com$request_uri;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    # Depoya ait olup yayınlanmayacak dosyalar
    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/(deploy|README\.md|CNAME)$ { return 404; }

    # Statik dosya önbelleği
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;
}
